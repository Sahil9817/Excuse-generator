{% extends "base.html" %}
{% block title %}Login — ExcuseAI{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="min-h-[90vh] flex items-center justify-center px-4">
  <div class="w-full max-w-md animate-slide-up">
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center font-display font-black text-[#0d1117] text-2xl mx-auto mb-4">EX</div>
      <h1 class="font-display font-black text-2xl text-white">Welcome back</h1>
      <p class="text-[#8b949e] text-sm mt-1">Sign in to your ExcuseAI account</p>
    </div>

    <div class="card p-7">
      <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
        <div>
          <div class="section-label">Username</div>
          <div class="relative">
            <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-[#484f58] text-xs"></i>
            <input type="text" name="username" required placeholder="your_username"
                   class="inp pl-9" autocomplete="username"/>
          </div>
        </div>
        <div>
          <div class="section-label">Password</div>
          <div class="relative">
            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-[#484f58] text-xs"></i>
            <input type="password" name="password" required placeholder="••••••••"
                   class="inp pl-9" autocomplete="current-password"/>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full justify-center py-3">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <p class="text-center text-[#8b949e] text-sm mt-5">
        No account?
        <a href="{{ url_for('register') }}" class="text-[#22d3ee] hover:underline font-medium">Create one free</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
